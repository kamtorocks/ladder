# 部署用 compose：不映射宿主机端口，仅加入外部网络 discovery，
# 由同网络内的网关反代到 http://ladder:8090。
# 含密钥的变量（如 CLASH_TOKEN）放在同目录 .env 中，不入库。
services:
  ladder:
    image: ghcr.io/kamtorocks/ladder:latest
    container_name: ladder
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 订阅访问令牌，从同目录 .env 读取（CLASH_TOKEN=xxx）；设置后订阅地址需带 ?token=xxx，不设则公开
      - CLASH_TOKEN=${CLASH_TOKEN:-}
      # 规则文件定时同步（cron 按 UTC 计算，18:00 UTC = 北京时间 02:00）
      - SYNC_CRON=0 18 * * *
      # 启动后 1 分钟内先同步一次
      - SYNC_ON_START=true
    volumes:
      - ./pb_data:/pb/pb_data
    expose:
      - "8090"
    networks:
      - discovery
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  discovery:
    external: true
